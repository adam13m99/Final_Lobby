[package]
name = "lobbybaz"
version = "0.1.0"
edition = "2021"
description = "LobbyBaz"
# The window and the tray only. Everything the app actually does is in the Go
# binary this launches; see src/main.rs for why it is split that way.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde_json = "1"

[profile.release]
# The installer is downloaded over a domestic Iranian connection, sometimes a
# slow one. Every megabyte is a reason somebody gives up on the download.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
