<!doctype html>
<!-- The lang and dir attributes here are the boot defaults only. i18n.js
     overwrites both from the loaded language, which is what lets Persian flip
     the whole layout without a second stylesheet (D44). Nothing below carries
     user-facing text: every string is a data-t key resolved from
     strings/<lang>.json, and lobbyapp/ui_test.go fails the build if anybody
     types text into this file or uses a key that does not exist.

     The shape is D42's: a permanent toolbar down the side, the room list in
     the middle, friends and chat down the other side, announcements across
     the top. The lobby is somewhere you sit, not a list you pass through. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LobbyBaz</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- The gate. It only appears when the player does something that cannot be
     done anonymously, and what it asks for depends on the server: a
     coordinator with no database has no accounts, and there the app asks for
     a name and nothing else, exactly as it did before (D37, D45).

     It is the one deliberately flashy surface in the product (D61). Everything
     else is a dense working screen a player reads in two seconds; this is the
     first thing they ever see, it is shown perhaps twice in an install's life,
     and it is the only place a little light costs nothing. The app stays
     visible and blurred behind it so it is plainly a door in front of a room
     rather than a different application. -->
<div id="namegate" class="gate blur hidden">
  <div class="authwrap">
    <div class="authglow" aria-hidden="true"></div>
    <form class="authcard" id="nameform">
      <span class="authsweep" aria-hidden="true"></span>
      <div class="authinner">

        <div class="authhead">
          <span class="lbtile" data-t="app.short"></span>
          <span class="wordmark" data-t="namegate.title"></span>
          <div class="head-gap"></div>
          <span class="authnet" id="authnet">
            <span class="dot" aria-hidden="true"></span><span id="authnettext"></span>
          </span>
        </div>
        <div class="authrule" aria-hidden="true"></div>

        <!-- Accounts on: two doors into the same card, switched in place. -->
        <div class="modetabs hidden" id="authtabs">
          <button type="button" class="chattab active" data-mode="signin" data-t="auth.signin"></button>
          <button type="button" class="chattab" data-mode="signup" data-t="auth.signup"></button>
        </div>

        <h1 id="gatetitle"></h1>
        <p class="muted small" id="namewhy"></p>

        <!-- Accounts off: a typed name, and that is all there is. -->
        <div id="nickonly">
          <label class="field">
            <span data-t="auth.yourname"></span>
            <input id="nameinput" maxlength="20" data-t-placeholder="namegate.name.placeholder" autocomplete="off">
          </label>
          <label class="field">
            <span><span data-t="namegate.mmr"></span><em data-t="namegate.mmr.note"></em></span>
            <input id="mmrinput" type="number" min="0" max="15000" data-t-placeholder="namegate.mmr.placeholder" autocomplete="off">
          </label>
        </div>

        <!-- Accounts on. Four fields, and on the sign-up side they pair off
             two to a row: a column of four boxes reads as a long form, and
             this one is short. -->
        <div id="accountform" class="hidden">
          <div class="authfields" id="authfields">
            <label class="field">
              <span data-t="auth.username"></span>
              <input id="a-user" maxlength="24" autocomplete="username">
            </label>
            <label class="field signup-only">
              <span data-t="auth.displayname"></span>
              <input id="a-nick" maxlength="20" data-t-placeholder="auth.displayname.placeholder" autocomplete="nickname">
            </label>
            <label class="field">
              <span><span data-t="auth.password"></span><em class="signin-only" data-t="auth.nohint"></em></span>
              <input id="a-pass" type="password" maxlength="72" autocomplete="current-password">
            </label>
            <label class="field signup-only">
              <span><span data-t="namegate.mmr"></span><em data-t="auth.mmr.optional"></em></span>
              <input id="a-mmr" type="number" min="0" max="15000" data-t-placeholder="namegate.mmr.placeholder" autocomplete="off">
            </label>
          </div>
          <p class="warn-note signup-only" data-t="auth.norecovery"></p>
          <label class="checkrow signup-only">
            <input id="a-terms" type="checkbox">
            <span data-t="auth.terms"></span>
            <button type="button" class="linkish" id="readterms" data-t="auth.termslink"></button>
          </label>
        </div>

        <button class="primary block" type="submit" id="gatego"></button>
        <p class="gate-err" id="nameerr"></p>
        <p class="authfoot" id="authfoot"></p>
      </div>
    </form>
  </div>
</div>

<div id="shell">

<!-- ---------------------------------------------------------- TOOLBAR -->
<!-- Permanent, and in the same place on every screen (D42.5). Its last
     entry is not navigation: it is whether this PC is on a room's network,
     which is the state players most often get wrong. -->
<nav id="toolbar">
  <!-- The mark, not the word: at 72px the name does not fit, and a lobby
       that spells its own name at the player twice a second is not telling
       them anything they did not know when they opened it. -->
  <div class="brand" data-t="app.short"></div>

  <button class="nav active" data-screen="lobby">
    <span class="ico" aria-hidden="true">&#9636;</span><span data-t="nav.lobby"></span>
  </button>
  <button class="nav" data-screen="room" id="roomtab" disabled>
    <span class="ico" aria-hidden="true">&#11042;</span><span data-t="nav.room"></span>
  </button>
  <button class="nav" data-screen="tournaments">
    <span class="ico" aria-hidden="true">&#9819;</span><span data-t="nav.tournaments"></span>
  </button>
  <!-- Staff only, and hidden rather than disabled: an entry a player can see
       but never use is a question they will ask instead of playing. The
       coordinator refuses every call behind it regardless (D47). -->
  <button class="nav hidden" data-screen="mod" id="modtab">
    <span class="ico" aria-hidden="true">&#9878;</span><span data-t="nav.mod"></span>
  </button>

  <div class="nav-gap"></div>

  <!-- Diagnostics used to be its own entry in the toolbar. It is one button
       on the settings screen now, beside the network facts it explains. -->
  <button class="nav" data-screen="settings">
    <span class="ico" aria-hidden="true">&#9881;</span><span data-t="nav.settings"></span>
  </button>

  <button class="nav conn" id="connstate">
    <span class="dot" id="conndot" aria-hidden="true"></span>
    <span id="conntext"></span>
  </button>
</nav>

<!-- ----------------------------------------------------------- HEADER -->
<header id="top">
  <div class="searchbox">
    <input id="search" maxlength="40" data-t-placeholder="lobby.search.placeholder" autocomplete="off">
  </div>
  <!-- One segmented control rather than six loose pills: the filters are a
       single choice, and six outlines look like six switches. -->
  <div class="filters" id="filters">
    <button class="chip active" data-filter="all" data-t="lobby.filter.all"></button>
    <button class="chip" data-filter="joinable" data-t="lobby.filter.joinable"></button>
    <button class="chip" data-filter="waiting">
      <span class="cdot open" aria-hidden="true"></span><span data-t="lobby.filter.waiting"></span>
    </button>
    <button class="chip" data-filter="playing">
      <span class="cdot game" aria-hidden="true"></span><span data-t="lobby.filter.playing"></span>
    </button>
    <button class="chip" data-filter="mine" data-t="lobby.filter.eligible"></button>
    <button class="chip" data-filter="friends" data-t="lobby.filter.friends"></button>
  </div>

  <div class="head-gap"></div>

  <div class="status">
    <span class="pill" id="p-service"></span>
    <span class="pill quiet" id="p-online"></span>
    <button class="me" id="mebtn">
      <span id="meface" data-who=""></span>
      <span class="who">
        <span class="name" id="menick"></span><small id="memmr"></small>
      </span>
    </button>
  </div>
</header>

<!-- Announcements, then problems. Two strips: one the staff write, one the
     app writes about itself. -->
<!-- Terms that changed after somebody signed up are terms they have not
     agreed to. This says so where it cannot be missed, and offers both
     halves: read them, then accept them. -->
<div id="termsmoved" class="banner warn hidden">
  <span data-t="terms.changed"></span>
  <button class="tiny primary" id="termsread" data-t="terms.readaccept"></button>
</div>
<div id="banners" class="strip"></div>
<div id="banner" class="banner hidden"></div>
<div id="update" class="banner update hidden"></div>

<main id="stage">

<!-- ------------------------------------------------------------ LOBBY -->
<section id="screen-lobby" class="screen">
  <div class="panel roomspanel">
    <div class="panel-head">
      <h2 data-t="lobby.rooms"></h2>
      <span class="count" id="roomcount"></span>
      <div class="head-gap"></div>
      <span class="hint" id="sorthint"></span>
      <button class="primary" id="btn-create" data-t="lobby.create"></button>
    </div>

    <!-- Every heading sorts. A room list is read for one thing at a time -
         who has space, who is closest, who is at my level - and which one it
         is changes between one glance and the next. -->
    <div class="roomhead" id="roomhead">
      <button data-sort="name"><span data-t="lobby.col.room"></span><span class="arrow"></span></button>
      <button data-sort="players"><span data-t="lobby.col.players"></span><span class="arrow"></span></button>
      <button class="rcol-hide" data-sort="mmr"><span data-t="lobby.col.mmr"></span><span class="arrow"></span></button>
      <button class="rcol-hide" data-sort="ping" data-t-title="lobby.col.ping.explain"><span data-t="lobby.col.ping"></span><span class="arrow"></span></button>
      <button data-sort="status"><span data-t="lobby.col.status"></span><span class="arrow"></span></button>
    </div>
    <div id="roomlist" class="roomlist"></div>
  </div>
</section>

<!-- ------------------------------------------------------------- ROOM -->
<section id="screen-room" class="screen hidden">

  <!-- One line saying which room this is and how to get out of it. The old
       screen spent a whole panel head on the same three facts. -->
  <div class="roomtop">
    <button id="btn-tolobby" data-t="room.tolobby"></button>
    <span id="room-face"></span>
    <div class="who">
      <div class="title">
        <h2 id="room-name" data-t="room.title"></h2>
        <span class="badge" id="room-status"></span>
      </div>
      <div class="sub" id="room-sub"></div>
    </div>
    <div class="head-gap"></div>
    <button id="btn-invite" data-t="room.invite"></button>
    <button class="hostonly" id="btn-roomsettings" data-t="room.settings"></button>
  </div>

  <!-- The three steps between sitting down and being in the game, as three
       steps. The first version was a row of buttons that were sometimes
       disabled, and the commonest failure in the two-PC test was two players
       in a room, neither on the network, with nothing on screen saying so. -->
  <div class="stepper">
    <div class="step" id="step-seat">
      <span class="mark" id="step-seat-mark" aria-hidden="true">1</span>
      <div class="body">
        <div class="t" data-t="step.seat"></div>
        <div class="d" id="step-seat-detail"></div>
      </div>
    </div>
    <div class="step" id="step-net">
      <span class="mark" id="step-net-mark" aria-hidden="true">2</span>
      <div class="body">
        <div class="t" data-t="step.net"></div>
        <div class="d" id="step-net-detail"></div>
      </div>
    </div>
    <div class="step" id="step-game">
      <span class="mark" id="step-game-mark" aria-hidden="true">3</span>
      <div class="body">
        <div class="t" data-t="step.game"></div>
        <div class="d" data-t="step.game.detail"></div>
      </div>
    </div>
    <button class="primary" id="btn-step"></button>
  </div>

  <div class="netbanner" id="netbanner" hidden></div>

  <!-- Two columns because a Dota match is two teams. Filled by app.js,
       which knows which five slots belong to which side. -->
  <div class="teams" id="slots"></div>

  <!-- Five more seats under the two teams, for people who want to watch
       rather than play (D59). They are seats, not a strip of text: somebody
       who wants to watch a friend's game sits down in one. -->
  <div id="watch"></div>

  <div class="specrow">
    <div class="head-gap"></div>
    <span class="net" id="netinfo"></span>
    <button class="danger" id="btn-leave" data-t="room.leave"></button>
  </div>
</section>

<!-- ------------------------------------------------------ TOURNAMENTS -->
<!-- The toolbar entry ships pointing at an honest "not yet" rather than a
     dead link. Section 12 of the spec lists tournaments among the things not
     being built, and D48 left it an open question rather than a promise. -->
<section id="screen-tournaments" class="screen hidden">
  <div class="panel wide empty-state">
    <h2 data-t="tournaments.title"></h2>
    <p class="muted" data-t="tournaments.soon"></p>
  </div>
</section>

<!-- --------------------------------------------------------- SETTINGS -->
<!-- Everything about this installation rather than about a room: who the
     server thinks you are, what the network is doing, and the checks that
     explain it when it is doing nothing. Diagnostics used to be its own
     toolbar entry; it belongs beside the facts it diagnoses. -->
<section id="screen-settings" class="screen hidden">
  <div class="settings">

    <!-- The build number sits in the page header rather than in a card of its
         own. It is the first thing anybody is asked for when something is
         wrong, and hunting for it wastes the call. -->
    <div class="sethead">
      <div>
        <h1 data-t="settings.title"></h1>
        <p class="muted small" data-t="settings.blurb"></p>
      </div>
      <div class="head-gap"></div>
      <div class="stamp" id="set-build"></div>
    </div>

    <!-- Who the server thinks you are, said once, in the accent, at the top.
         Everything below is about this machine; this is about the person. -->
    <div class="identity">
      <span class="edge" aria-hidden="true"></span>
      <span id="set-face"></span>
      <div class="idwho">
        <div class="idname">
          <span id="set-name"></span>
          <span class="tag hostable hidden" id="set-hostable" data-t="settings.hostable"></span>
        </div>
        <div class="muted small" id="set-sub"></div>
      </div>
      <div class="head-gap"></div>
      <div class="idacts">
        <button id="btn-editprofile" data-t="settings.edit"></button>
        <button class="hidden" id="btn-password" data-t="auth.changepw"></button>
        <button class="hidden danger" id="btn-signout" data-t="auth.signout"></button>
      </div>
    </div>

    <div class="setgrid">
      <div class="card">
        <div class="cardhead">
          <h3 data-t="settings.network"></h3>
          <div class="head-gap"></div>
          <span class="muted small" id="diagwhen"></span>
        </div>
        <div class="tiles">
          <div class="tile">
            <div class="k" data-t="settings.adapter"></div>
            <div class="v" id="fact-adapter"></div>
          </div>
          <div class="tile">
            <div class="k" data-t="settings.relay"></div>
            <div class="v"><span id="fact-relay"></span> <em class="q" id="fact-relayq"></em></div>
          </div>
          <div class="tile">
            <div class="k" data-t="settings.service"></div>
            <div class="v"><span class="sdot" id="fact-servicedot" aria-hidden="true"></span><span id="fact-service"></span></div>
          </div>
        </div>
        <!-- Three checks take a few seconds and say nothing while they run.
             An indeterminate bar is the difference between "working" and
             "broken" for the person watching it. -->
        <div class="sweep hidden" id="diagbar"><span aria-hidden="true"></span></div>
        <div class="inline cardfoot">
          <button class="primary" id="btn-diag" data-t="checks.run"></button>
          <span class="muted small" data-t="checks.what"></span>
        </div>
        <div id="diaglist" class="diaglist"></div>
      </div>

      <div class="card">
        <h3 data-t="settings.game"></h3>
        <div class="field">
          <span data-t="settings.game.where"></span>
          <div class="pathbox" id="fact-dota"></div>
        </div>
        <p class="muted small" id="set-gamenote"></p>

        <!-- The player's own launch options. LobbyBaz builds the arguments
             that decide which match you join and on whose side; this is the
             rest of the command line - the graphics and startup knobs people
             already have in Steam. Engine flags only, and the service checks
             them again before anything runs (D65). -->
        <div class="field">
          <label for="set-opts" data-t="settings.opts"></label>
          <input id="set-opts" type="text" spellcheck="false" autocomplete="off"
                 data-t-placeholder="settings.opts.eg" maxlength="200">
        </div>
        <div class="inline cardfoot">
          <button class="primary" id="btn-saveopts" data-t="settings.opts.save"></button>
          <span class="muted small" id="set-optsnote" data-t="settings.opts.note"></span>
        </div>
      </div>
    </div>

    <div class="about">
      <h3 data-t="settings.about"></h3>
      <span id="fact-version"></span>
      <span data-t="settings.novalve"></span>
      <div class="head-gap"></div>
      <button class="linkish" id="btn-showterms" data-t="auth.readterms"></button>
    </div>
  </div>
</section>

<!-- ------------------------------------------------------- MODERATION -->
<!-- What T8 built, with a door on it (D43, D47). Every panel here asks the
     coordinator, which refuses anybody without a role; this screen only
     decides what is worth drawing. -->
<section id="screen-mod" class="screen hidden">
  <div class="panel wide">
    <div class="panel-head">
      <div>
        <h2 data-t="mod.title"></h2>
        <p class="muted small" data-t="mod.blurb"></p>
      </div>
      <span class="badge" id="mod-role"></span>
    </div>

    <form class="inline pad" id="modfind">
      <input id="mod-username" maxlength="32" data-t-placeholder="mod.find.placeholder" autocomplete="off">
      <button class="primary" type="submit" data-t="mod.find"></button>
    </form>

    <div id="mod-record" class="record hidden">
      <div class="panel-head plain">
        <div>
          <h3 id="mod-who"></h3>
          <p class="muted small" id="mod-restriction"></p>
        </div>
      </div>

      <!-- Appointing an admin happens where you have just read somebody's
           record, not from a separate list of people who are already staff.
           Head admin only (D47); hidden for everybody else. -->
      <div class="inline pad hidden" id="mod-appointrow">
        <button class="tiny" id="mod-appoint" data-t="mod.staff.appoint"></button>
        <span class="muted small" data-t="mod.staff.appoint.note"></span>
      </div>

      <div class="labelrow" id="mod-labels"></div>
      <form class="inline" id="modlabelform">
        <select id="mod-label"></select>
        <button type="submit" data-t="mod.label.add"></button>
      </form>

      <h4 data-t="mod.sanction.title"></h4>
      <form class="sanctionform" id="modsanctionform">
        <label class="field inline-field">
          <span data-t="mod.sanction.kind"></span>
          <select id="mod-kind">
            <option value="mute" data-t="mod.sanction.mute"></option>
            <option value="timeout" data-t="mod.sanction.timeout"></option>
            <option value="ban" data-t="mod.sanction.ban"></option>
          </select>
        </label>
        <label class="field inline-field">
          <span data-t="mod.sanction.minutes"></span>
          <input id="mod-minutes" type="number" min="0" max="525600" value="60">
        </label>
        <input id="mod-reason" maxlength="200" data-t-placeholder="mod.reason.placeholder" autocomplete="off">
        <button class="danger" type="submit" data-t="mod.sanction.apply"></button>
      </form>
      <p class="muted small" data-t="mod.sanction.forever"></p>

      <h4 data-t="mod.history"></h4>
      <div id="mod-sanctions" class="loglist"></div>

      <h4 data-t="mod.actions"></h4>
      <div id="mod-actions" class="loglist"></div>

      <!-- What this person has *done*, for the head admin reviewing an
           admin. Everything above is what was done to them, which is a
           different question and the only one the record used to answer. -->
      <div class="hidden" id="mod-byrow">
        <h4 data-t="mod.bythem"></h4>
        <div id="mod-bythem" class="loglist"></div>
      </div>
    </div>
  </div>

  <div class="panel wide">
    <div class="panel-head plain"><h3 data-t="mod.rooms"></h3></div>
    <p class="muted small pad" data-t="mod.rooms.blurb"></p>
    <div id="mod-rooms" class="loglist"></div>
  </div>

  <div class="panel wide">
    <div class="panel-head plain"><h3 data-t="mod.banners"></h3></div>
    <p class="muted small pad" data-t="mod.banners.blurb"></p>
    <form class="bannerform" id="modbannerform">
      <input id="ban-title" maxlength="80" data-t-placeholder="mod.banner.title" autocomplete="off">
      <textarea id="ban-body" maxlength="400" rows="2" data-t-placeholder="mod.banner.body"></textarea>
      <input id="ban-link" maxlength="300" data-t-placeholder="mod.banner.link" autocomplete="off">
      <div class="inline">
        <label class="checkrow">
          <input id="ban-active" type="checkbox" checked>
          <span data-t="mod.banner.active"></span>
        </label>
        <button class="primary" type="submit" data-t="mod.banner.save"></button>
      </div>
    </form>
    <div id="mod-bannerlist" class="loglist"></div>
  </div>

  <!-- Head admin only: an admin who could appoint another admin would mean
       the role spreads and cannot be pulled back (D47). -->
  <div class="panel wide hidden" id="mod-staffpanel">
    <div class="panel-head plain"><h3 data-t="mod.staff"></h3></div>
    <p class="muted small pad" data-t="mod.staff.blurb"></p>
    <div id="mod-staff" class="loglist"></div>
  </div>
</section>

</main>

<!-- ------------------------------------------------------------- RAIL -->
<!-- Friends above, chat below, both down the same side (D42.2, D42.3). The
     chat collapses the way Dota's own does, and stays collapsed. -->
<aside id="rail">
  <div class="rail-head">
    <span class="t" data-t="friends.title"></span>
    <span class="n" id="friendcount"></span>
    <div class="head-gap"></div>
    <button class="iconbtn" id="btn-findfriend" data-t-title="friends.add">
      <span aria-hidden="true">+</span>
    </button>
  </div>
  <div class="railtop">
    <form class="findrow hidden" id="findform">
      <input id="findinput" maxlength="24" data-t-placeholder="friends.find.placeholder" autocomplete="off">
      <button class="primary" type="submit" data-t="friends.find"></button>
    </form>
    <p class="findresult muted small" id="findresult"></p>
    <div class="friendlist" id="friendlist"></div>
  </div>
</aside>

<!-- ------------------------------------------------------------ CHAT -->
<!-- Docked along the bottom and always there, the way Dota's own is: a tab
     strip when it is minimised, opening upward when somebody uses it or when
     a message arrives. Every conversation is a tab, private ones included, so
     starting one does not cover the lobby with a dialog. -->
<section id="chatdock" class="chatdock">
  <div class="chattabs" id="chattabs">
    <div class="tabstrip" id="tabstrip">
      <button class="chattab active" data-chat="lobby" data-t="chat.tab.lobby"></button>
      <button class="chattab" data-chat="room" id="chattab-room" data-t="chat.tab.room"></button>
      <button class="chattab" data-chat="party" data-t="chat.tab.party"></button>
    </div>
    <button class="tabadd" id="chatadd" data-t-title="chat.new">
      <span aria-hidden="true">+</span>
    </button>
    <div class="tabgap"></div>
    <span class="presence" id="presence"></span>
    <button class="tabmin" id="chatmin" data-t-title="chat.minimise">
      <span aria-hidden="true">&#9662;</span>
    </button>

    <!-- Who to start a conversation with. Opened by the + on the strip, and
         hung off the strip rather than opened as a dialog: picking a friend
         is not worth losing sight of the lobby. -->
    <div class="tabmenu hidden" id="chatmenu"></div>
  </div>


  <div class="chatbody">
    <div class="chatlog" id="chatlog"></div>
    <form class="chatbox" id="chatform">
      <span class="chatto" id="chatto"></span>
      <input id="chatinput" maxlength="300" data-t-placeholder="chat.placeholder" autocomplete="off">
      <button class="primary" type="submit" data-t="chat.send"></button>
    </form>
  </div>
</section>

</div><!-- /shell -->


<!-- --------------------------------------------------------- CREATE ROOM -->
<!-- The door is chosen before the room exists, not after (D41): a room opened
     public and locked a second later is a second in which anybody can walk
     in. It is a dialog rather than a row in the header because five controls
     across the top of the lobby made the lobby look like a form. -->
<div id="creategate" class="gate hidden">
  <form class="gate-card" id="createform">
    <div class="gate-head">
      <h2 data-t="create.title"></h2>
      <p data-t="create.blurb"></p>
    </div>
    <div class="gate-body">
      <label class="field">
        <span data-t="create.name"></span>
        <input id="roomname" maxlength="40" data-t-placeholder="lobby.roomname.placeholder" autocomplete="off">
      </label>

      <div class="field">
        <span data-t="create.who"></span>
        <div class="segment" id="newdoor">
          <button type="button" class="active" data-door="public" data-t="door.public"></button>
          <button type="button" data-door="friends" data-t="door.friends"></button>
          <button type="button" data-door="invite" data-t="door.invite"></button>
        </div>
      </div>

      <div class="twoup">
        <label class="field">
          <span data-t="door.mmr"></span>
          <input id="newmmr" type="number" min="0" max="15000" step="500" data-t-placeholder="door.mmr.any">
        </label>
        <label class="field" id="newpassfield">
          <span data-t="door.password.placeholder"></span>
          <input id="newpass" type="password" maxlength="40" autocomplete="off">
        </label>
      </div>

      <!-- A password is a second lock on the same door rather than a fourth
           kind of door. The coordinator stores it as its own privacy, so
           only an otherwise-open room can carry one. -->
      <label class="checkrow" id="newpasscheck">
        <input id="newpasson" type="checkbox">
        <span data-t="create.password"></span>
      </label>

      <div class="note">
        <span class="icon" aria-hidden="true">i</span>
        <span data-t="create.note"></span>
      </div>
      <p class="gate-err" id="createerr"></p>
    </div>
    <div class="gate-foot">
      <button type="button" id="createcancel" data-t="profile.cancel"></button>
      <button class="primary" type="submit" data-t="create.go"></button>
    </div>
  </form>
</div>

<!-- ------------------------------------------------------- ROOM SETTINGS -->
<!-- The host's controls, all of them, in one place. The coordinator refuses
     every one of these from anybody else, so hiding them is a courtesy that
     keeps the room screen honest rather than a defence. -->
<div id="roomsetgate" class="gate hidden">
  <div class="gate-card wide">
    <div class="gate-head">
      <h2 data-t="room.settings"></h2>
      <p data-t="room.settings.blurb"></p>
    </div>
    <div class="gate-body">
      <form class="field" id="describeform">
        <span data-t="room.describe"></span>
        <div class="inline">
          <input id="describe" class="grow" maxlength="120" data-t-placeholder="room.describe.placeholder" autocomplete="off">
          <button type="submit" data-t="room.describe.save"></button>
        </div>
      </form>

      <form class="field" id="doorform">
        <span data-t="create.who"></span>
        <div class="segment" id="door">
          <button type="button" class="active" data-door="public" data-t="door.public"></button>
          <button type="button" data-door="friends" data-t="door.friends"></button>
          <button type="button" data-door="invite" data-t="door.invite"></button>
        </div>
        <div class="twoup">
          <label class="field">
            <span data-t="door.mmr"></span>
            <input id="doormmr" type="number" min="0" max="15000" step="500" data-t-placeholder="door.mmr.any">
          </label>
          <label class="field">
            <span data-t="door.password.placeholder"></span>
            <input id="doorpass" type="password" maxlength="40" autocomplete="off">
          </label>
        </div>
        <div class="inline">
          <button type="submit" data-t="door.save"></button>
          <span class="muted small" id="doornow"></span>
        </div>
      </form>

      <div class="field">
        <span data-t="room.admission"></span>
        <div class="inline">
          <button id="btn-lock" data-t="room.lock"></button>
          <button id="btn-reopen" data-t="room.reopen"></button>
          <button id="btn-open" data-t="room.openall"></button>
        </div>
      </div>

      <label class="field">
        <span data-t="room.mode"></span>
        <select id="mode">
          <option value="1" data-t="room.mode.ap"></option>
          <option value="2" data-t="room.mode.cm"></option>
          <option value="3" data-t="room.mode.rd"></option>
          <option value="4" data-t="room.mode.sd"></option>
          <option value="5" data-t="room.mode.ar"></option>
          <option value="22" data-t="room.mode.rap"></option>
        </select>
      </label>
    </div>
    <div class="gate-foot">
      <button id="roomsetclose" data-t="profile.done"></button>
    </div>
  </div>
</div>

<!-- ------------------------------------------------------------- INVITE -->
<!-- One word, two things: tell them to come, and let them through the door.
     Doing only the first is how somebody is invited and then refused (D41). -->
<div id="invitegate" class="gate hidden">
  <div class="gate-card narrow">
    <div class="gate-head">
      <h2 data-t="room.invite"></h2>
      <p data-t="room.invite.blurb"></p>
    </div>
    <div class="gate-body" id="invitelist"></div>
    <div class="gate-foot">
      <button id="inviteclose" data-t="profile.done"></button>
    </div>
  </div>
</div>

<!-- Profile editor -->
<div id="profilegate" class="gate hidden">
  <form class="gate-card" id="profileform">
    <div class="gate-who">
      <div id="p-face"></div>
      <div>
        <h1 data-t="profile.title"></h1>
        <p class="muted small" id="p-who"></p>
      </div>
    </div>
    <label class="field">
      <span data-t="profile.name"></span>
      <input id="p-nick" maxlength="20" autocomplete="off" required>
    </label>
    <label class="field">
      <span><span data-t="profile.mmr"></span> <em id="mmrnote"></em></span>
      <input id="p-mmr" type="number" min="0" max="15000" autocomplete="off">
    </label>
    <div class="gate-actions">
      <button class="primary" type="submit" data-t="profile.save"></button>
      <button type="button" class="ghost" id="p-cancel" data-t="profile.cancel"></button>
      <button type="button" class="ghost hidden" id="p-password" data-t="pass.open"></button>
      <button type="button" class="ghost danger hidden" id="p-signout" data-t="auth.signout"></button>
    </div>
    <p class="gate-err" id="profileerr"></p>
  </form>
</div>

<!-- Changing a password is its own dialog rather than three more fields on
     the profile form. It is the one lever somebody has when they think
     another person knows their password, and the sign-up screen says plainly
     that a forgotten one cannot be reset. -->
<div id="passgate" class="gate hidden">
  <form class="gate-card" id="passform">
    <h1 data-t="pass.title"></h1>
    <p class="muted small" data-t="pass.note"></p>
    <!-- Hidden, and there for the password manager rather than the person: a
         password form with no username beside it makes managers save the new
         password against the wrong account, or not offer to at all. -->
    <input id="pw-user" class="offscreen" type="text" autocomplete="username" tabindex="-1" aria-hidden="true" readonly>
    <label class="field">
      <span data-t="pass.current"></span>
      <input id="pw-old" type="password" maxlength="72" autocomplete="current-password" required>
    </label>
    <label class="field">
      <span data-t="pass.next"></span>
      <input id="pw-new" type="password" maxlength="72" autocomplete="new-password" required>
    </label>
    <label class="field">
      <span data-t="pass.again"></span>
      <input id="pw-again" type="password" maxlength="72" autocomplete="new-password" required>
    </label>
    <div class="gate-actions">
      <button class="primary" type="submit" data-t="pass.save"></button>
      <button type="button" class="ghost" id="pw-cancel" data-t="profile.cancel"></button>
    </div>
    <p class="gate-err" id="passerr"></p>
  </form>
</div>

<!-- The terms. Read before the checkbox is ticked, not after: the Accept
     button is inert until the text has been scrolled to the end, and the bar
     under the header says how far that is. Consent to a wall of text nobody
     scrolled is not consent, and the gate costs an honest reader four
     seconds. -->
<div id="termsgate" class="gate blur hidden">
  <div class="termscard">
    <div class="termshead">
      <div>
        <h2 data-t="auth.termstitle"></h2>
        <p class="muted small" id="termsver"></p>
      </div>
      <div class="head-gap"></div>
      <span class="muted small" id="termspct"></span>
      <button class="tiny" id="termsclose" data-t="terms.close"></button>
    </div>
    <div class="termsbar" aria-hidden="true"><span id="termsfill"></span></div>
    <div class="termsbody" id="termstext"></div>
    <div class="termsfoot">
      <span class="small" id="termsstate"></span>
      <div class="head-gap"></div>
      <button id="termsnot" data-t="terms.notnow"></button>
      <button class="primary" id="termsok" data-t="terms.acceptgo"></button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
