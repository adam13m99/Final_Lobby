<!doctype html>
<!-- The lang and dir attributes here are the boot defaults only. i18n.js
     overwrites both from the loaded language, which is what lets Persian flip
     the whole layout without a second stylesheet (D44). Nothing below carries
     user-facing text: every string is a data-t key resolved from
     strings/<lang>.json, and lobbyapp/ui_test.go fails the build if anybody
     types text into this file or uses a key that does not exist. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LobbyBaz</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- First run. The only thing we ever ask for. -->
<div id="namegate" class="gate hidden">
  <form class="gate-card" id="nameform">
    <h1 data-t="namegate.title"></h1>
    <p class="muted" data-t="namegate.blurb"></p>
    <input id="nameinput" maxlength="20" data-t-placeholder="namegate.name.placeholder" autocomplete="off" required>
    <label class="field">
      <span><span data-t="namegate.mmr"></span> <em data-t="namegate.mmr.note"></em></span>
      <input id="mmrinput" type="number" min="0" max="15000" data-t-placeholder="namegate.mmr.placeholder" autocomplete="off">
    </label>
    <button class="primary" type="submit" data-t="namegate.submit"></button>
    <p class="gate-err" id="nameerr"></p>
  </form>
</div>

<header id="top">
  <div class="brand" data-t="app.name"></div>

  <nav class="tabs">
    <button class="tab active" data-screen="lobby" data-t="nav.lobby"></button>
    <button class="tab" data-screen="room" id="roomtab" disabled data-t="nav.room"></button>
    <button class="tab" data-screen="checks" data-t="nav.checks"></button>
  </nav>

  <div class="status">
    <span class="pill" id="p-service"></span>
    <span class="pill" id="p-tunnel"></span>
    <span class="pill quiet" id="p-online"></span>
    <button class="me" id="mebtn"><span id="menick"></span><small id="memmr"></small></button>
  </div>
</header>

<div id="banner" class="banner hidden"></div>
<div id="update" class="banner update hidden"></div>

<main>

<!-- ------------------------------------------------------------ LOBBY -->
<section id="screen-lobby" class="screen">
  <div class="col-main">
    <div class="panel">
      <div class="panel-head">
        <h2 data-t="lobby.rooms"></h2>
        <form id="createform" class="inline">
          <input id="roomname" maxlength="40" data-t-placeholder="lobby.roomname.placeholder" autocomplete="off">
          <button class="primary" type="submit" data-t="lobby.create"></button>
        </form>
      </div>
      <div id="roomlist" class="roomlist"></div>
    </div>
  </div>

  <div class="col-side">
    <div class="panel chatpanel">
      <div class="panel-head"><h2 data-t="lobby.chat"></h2></div>
      <div class="chatlog" id="lobbylog"></div>
      <form class="chatbox" id="lobbychatform">
        <input id="lobbychatinput" maxlength="300" data-t-placeholder="chat.placeholder" autocomplete="off">
        <button type="submit" data-t="chat.send"></button>
      </form>
    </div>
  </div>
</section>

<!-- ------------------------------------------------------------- ROOM -->
<section id="screen-room" class="screen hidden">
  <div class="col-main">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2 id="room-name" data-t="room.title"></h2>
          <p class="muted small" id="room-sub"></p>
        </div>
        <span class="badge" id="room-status"></span>
      </div>

      <div class="slots" id="slots"></div>

      <div class="specrow">
        <h3><span data-t="room.spectators"></span> <em data-t="room.spectators.note"></em></h3>
        <div class="spectators" id="spectators"></div>
      </div>
    </div>

    <div class="panel actions">
      <!-- The network state has to be impossible to miss. The first two-PC
           test failed because both players were in a room, neither was on
           its network, and the only sign was a small pill in the header. -->
      <div class="netbanner" id="netbanner" hidden></div>

      <div class="actionrow">
        <button class="primary big" id="btn-connect" data-t="room.connect"></button>
        <button class="ghost" id="btn-disconnect" data-t="room.disconnect"></button>
        <span class="net" id="netinfo"></span>
      </div>

      <div class="actionrow">
        <label class="field inline-field">
          <span data-t="room.mode"></span>
          <select id="mode">
            <option value="1" data-t="room.mode.ap"></option>
            <option value="2" data-t="room.mode.cm"></option>
            <option value="3" data-t="room.mode.rd"></option>
            <option value="4" data-t="room.mode.sd"></option>
            <option value="5" data-t="room.mode.ar"></option>
            <option value="22" data-t="room.mode.rap"></option>
          </select>
        </label>
        <label class="field inline-field">
          <span data-t="room.team"></span>
          <select id="team">
            <option value="good" data-t="room.team.radiant"></option>
            <option value="bad" data-t="room.team.dire"></option>
          </select>
        </label>
        <button class="launch big" id="btn-play" data-t="room.play"></button>
      </div>

      <div class="actionrow hostonly" id="hostcontrols">
        <button id="btn-lock" data-t="room.lock"></button>
        <button id="btn-reopen" data-t="room.reopen"></button>
        <button id="btn-open" data-t="room.openall"></button>
      </div>

      <div class="actionrow">
        <button class="danger ghost" id="btn-leave" data-t="room.leave"></button>
        <button class="ghost" id="btn-tolobby" data-t="room.tolobby"></button>
      </div>
    </div>
  </div>

  <div class="col-side">
    <div class="panel chatpanel">
      <div class="panel-head"><h2 data-t="room.chat"></h2></div>
      <div class="chatlog" id="roomlog"></div>
      <form class="chatbox" id="roomchatform">
        <input id="roomchatinput" maxlength="300" data-t-placeholder="chat.placeholder" autocomplete="off">
        <button type="submit" data-t="chat.send"></button>
      </form>
    </div>
  </div>
</section>

<!-- ------------------------------------------------------ DIAGNOSTICS -->
<section id="screen-checks" class="screen hidden">
  <div class="panel wide">
    <div class="panel-head">
      <div>
        <h2 data-t="checks.title"></h2>
        <p class="muted small" data-t="checks.blurb"></p>
      </div>
      <button class="primary" id="btn-diag" data-t="checks.run"></button>
    </div>
    <div id="diaglist" class="diaglist">
      <p class="muted pad" data-t="checks.none"></p>
    </div>
    <p class="muted small pad" id="diagwhen"></p>
  </div>
</section>

</main>

<!-- Profile editor -->
<div id="profilegate" class="gate hidden">
  <form class="gate-card" id="profileform">
    <h1 data-t="profile.title"></h1>
    <label class="field">
      <span data-t="profile.name"></span>
      <input id="p-nick" maxlength="20" autocomplete="off" required>
    </label>
    <label class="field">
      <span><span data-t="profile.mmr"></span> <em id="mmrnote"></em></span>
      <input id="p-mmr" type="number" min="0" max="15000" autocomplete="off">
    </label>
    <div class="gate-actions">
      <button class="primary" type="submit" data-t="profile.save"></button>
      <button type="button" class="ghost" id="p-cancel" data-t="profile.cancel"></button>
    </div>
    <p class="gate-err" id="profileerr"></p>
  </form>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
